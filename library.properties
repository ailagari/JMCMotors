name=LagariMotors
version=0.1.1
author=LAGARI A <lagariscience@gmail.com>
maintainer=LAGARI A <lagariscience@gmail.com>
sentence=Internal beta - UDP command system for integrated servo/stepper drives (Modbus-RTU / RS-485) on Controllino.
paragraph=Hardened Modbus-RTU transport (CRC-verified responses, exception detection, retries, real timeouts), unit-correct motor control (position, velocity, homing, zero/position redefinition), a non-blocking status monitor that pushes limit-switch, fault and online/offline events over UDP, and a full command set (P, PA, S, SD, B, L, BS, Z, ZO, ZS, R, I, X plus V/VA/VS/HV/H extensions). Internal test build - not the final public release.
category=Device Control
url=https://github.com/ailagari/LagariMotors
architectures=avr
depends=CONTROLLINO,Ethernet
includes=LagariMotors.h
