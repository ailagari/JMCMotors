name=JMCMotors
version=0.6.0
author=LAGARI A <lagariscience@gmail.com>
maintainer=LAGARI A <lagariscience@gmail.com>
sentence=Text-command controller for up to 32 JMC integrated servo/stepper drives (Modbus-RTU / RS-485) on CONTROLLINO, ESP32 and Arduino Uno.
paragraph=PC link over Ethernet/WiFi UDP or a serial line; drives on any serial port with a TTL-to-RS-485 module (DE/RE pin or auto-direction) or the CONTROLLINO built-in RS-485. Hardened Modbus-RTU (CRC-checked replies, exceptions, retries, timeouts), position, velocity and homing methods 1-12, synchronised-arrival moves (PS/PRS), soft limits, communication and processor watchdogs, sender allow-list, reply tags, and a non-blocking monitor that pushes limit, origin, homing, fault, soft-limit and online/offline events. One command grammar: CMD:<slots> for individual motors, CMDA for all. No heap, no String.
category=Device Control
url=https://github.com/ailagari/JMCMotors
architectures=avr,esp32
depends=CONTROLLINO,Ethernet
includes=JMCMotors.h
