name=JMCMotors
version=0.5.0
author=LAGARI A <lagariscience@gmail.com>
maintainer=LAGARI A <lagariscience@gmail.com>
sentence=UDP command system for integrated servo/stepper drives (Modbus-RTU / RS-485) on Controllino.
paragraph=Hardened Modbus-RTU transport (CRC-verified responses, exception detection, retries, real timeouts), unit-correct motor control (position, velocity, homing methods 1-12, zero/position redefinition), a non-blocking status monitor that pushes limit-switch (CW/CCW), origin-switch, homing-complete, fault and online/offline events over UDP, and one uniform command grammar: CMD:<slots> for individual motors, CMDA for all motors (P, PR, V, VS, ACC, DEC, B0-B3, L, BS, Z, ZO, ZS, HV, HVZ, HACC, HO, H1-H12, S, SD, LS, DG, I, R) plus MC, SAVE/LOAD (EEPROM), VER, PING, X. Motor count 1-32.
category=Device Control
url=https://github.com/ailagari/JMCMotors
architectures=avr
depends=CONTROLLINO,Ethernet
includes=JMCMotors.h
