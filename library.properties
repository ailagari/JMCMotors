name=LagariMotors
version=0.3.0
author=LAGARI A <lagariscience@gmail.com>
maintainer=LAGARI A <lagariscience@gmail.com>
sentence=UDP command system for integrated servo/stepper drives (Modbus-RTU / RS-485) on Controllino.
paragraph=Hardened Modbus-RTU transport (CRC-verified responses, exception detection, retries, real timeouts), unit-correct motor control (position, velocity, homing, zero/position redefinition), a non-blocking status monitor that pushes limit-switch, fault and online/offline events over UDP, and a full command set (P, PR, PA, S, SD, B, L, BS, Z, ZO, ZS, R, I, X, MC, DG plus V/VA/VS/AD/HV/HO/H extensions).
category=Device Control
url=https://github.com/ailagari/LagariMotors
architectures=avr
depends=CONTROLLINO,Ethernet
includes=LagariMotors.h
